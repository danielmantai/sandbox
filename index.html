<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Sandbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        p {
            color: #a0a0a0;
            line-height: 1.6;
            margin-top: 1rem;
        }

        .projects {
            margin-top: 2rem;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .projects h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #00d9ff;
        }

        .empty-state {
            color: #666;
            font-style: italic;
        }

        .project-link {
            display: block;
            padding: 16px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: #00d9ff;
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .project-link:hover, .project-link:active {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
        }

        .project-link .title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .project-link .desc {
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mobile Sandbox</h1>

        <div class="status">
            <span class="status-dot"></span>
            <span>Pipeline is live!</span>
        </div>

        <p>
            This sandbox is built from an iPhone using Claude Code.
            Games, tools, and experiments will appear here.
        </p>

        <div class="projects">
            <h2>Projects</h2>
            <a href="paperclips.html" class="project-link">
                <div class="title">Paperclips</div>
                <div class="desc">Incremental clicker game</div>
            </a>
        </div>
    </div>
</body>
</html>
